<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mit vigyek? Időjárás</title>
<meta name="description" content="Reggeli döntéshez és előre tervezéshez: esernyő, pulcsi, 16 napos kilátás.">
<meta name="theme-color" content="#E7ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Időjárás">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ikonkészlet -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <path id="p-cloud" class="cl" d="M9.5 24.5h12a5 5 0 0 0 .7-9.95A7 7 0 0 0 8.7 16 4.3 4.3 0 0 0 9.5 24.5z"/>
    <g id="g-rays" class="sun-s">
      <path d="M16 2.5v3M16 26.5v3M2.5 16h3M26.5 16h3M6.5 6.5l2.1 2.1M23.4 23.4l2.1 2.1M25.5 6.5l-2.1 2.1M8.6 23.4l-2.1 2.1"/>
    </g>
    <path id="p-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </defs>

  <!-- időjárás -->
  <symbol id="i-sun" viewBox="0 0 32 32"><use href="#g-rays"/><circle class="sun-f" cx="16" cy="16" r="6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 32 32"><use href="#p-moon" class="moon-f" transform="translate(3.5 4) scale(1.05)"/></symbol>
  <symbol id="i-partly" viewBox="0 0 32 32">
    <g transform="translate(-1 -1) scale(.62) translate(2 4)"><use href="#g-rays"/></g>
    <circle class="sun-f" cx="11" cy="11" r="4.6"/>
    <use href="#p-cloud" transform="translate(5.5 6) scale(.8)"/>
  </symbol>
  <symbol id="i-partly-night" viewBox="0 0 32 32">
    <use href="#p-moon" class="moon-f" transform="translate(1 1) scale(.72)"/>
    <use href="#p-cloud" transform="translate(5.5 6) scale(.8)"/>
  </symbol>
  <symbol id="i-cloud" viewBox="0 0 32 32"><use href="#p-cloud" transform="translate(0 1.5)"/></symbol>
  <symbol id="i-fog" viewBox="0 0 32 32">
    <use href="#p-cloud" transform="translate(0 -2)"/>
    <path class="fg" d="M7 26h18M10 29.5h12"/>
  </symbol>
  <symbol id="i-drizzle" viewBox="0 0 32 32">
    <use href="#p-cloud" transform="translate(0 -3)"/>
    <path class="dr thin" d="M11 25.5v1.8M16.5 25.5v1.8M22 25.5v1.8M13.7 28.8v1.4M19.2 28.8v1.4"/>
  </symbol>
  <symbol id="i-rain" viewBox="0 0 32 32">
    <use href="#p-cloud" transform="translate(0 -3)"/>
    <path class="dr" d="M11.2 25l-1.4 3.6M16.7 25l-1.4 3.6M22.2 25l-1.4 3.6"/>
  </symbol>
  <symbol id="i-snow" viewBox="0 0 32 32">
    <use href="#p-cloud" transform="translate(0 -3)"/>
    <circle class="snow-d" cx="11" cy="26" r="1.6"/><circle class="snow-d" cx="16.5" cy="28.6" r="1.6"/><circle class="snow-d" cx="22" cy="26" r="1.6"/>
  </symbol>
  <symbol id="i-thunder" viewBox="0 0 32 32">
    <use href="#p-cloud" transform="translate(0 -3.5)"/>
    <path class="bolt" d="M17.6 19l-4.6 6.6h3.4l-1.5 5.4 5.8-7.6h-3.6z"/>
  </symbol>

  <!-- felület -->
  <symbol id="i-umbrella" viewBox="0 0 32 32"><path class="ln" d="M4 16a12 12 0 0 1 24 0zM16 16v9.5a2.7 2.7 0 0 1-5.4 0M16 2.5V4"/></symbol>
  <symbol id="i-sweater" viewBox="0 0 32 32"><path class="ln" d="M11.5 5.5L4 9.5l2.2 7 3.8-1.4V27h12V15.1l3.8 1.4 2.2-7-7.5-4c-.6 2.4-2.3 3.5-4.5 3.5S12.1 7.9 11.5 5.5zM10 22.5h12"/></symbol>
  <symbol id="i-shirt" viewBox="0 0 32 32"><path class="ln" d="M11.5 5.5L4 9l2.8 5.2L10 12.6V27h12V12.6l3.2 1.6L28 9l-7.5-3.5c-.6 2.4-2.3 3.5-4.5 3.5s-3.9-1.1-4.5-3.5z"/></symbol>
  <symbol id="i-coat" viewBox="0 0 32 32"><path class="ln" d="M11.5 4.5L4 9l2.2 7 3.8-1.4V28h12V14.6l3.8 1.4 2.2-7-7.5-4.5L16 9zM16 9v19M13 18h-.01M13 22h-.01"/></symbol>
  <symbol id="i-wind" viewBox="0 0 32 32"><path class="ln" d="M4 12h15a3.5 3.5 0 1 0-3.5-3.5M4 18h21a3.5 3.5 0 1 1-3.5 3.5M4 24h10"/></symbol>
  <symbol id="i-uv" viewBox="0 0 32 32"><circle class="ln" cx="16" cy="16" r="5.5"/><path class="ln" d="M16 4v3M16 25v3M4 16h3M25 16h3M7.5 7.5l2.1 2.1M22.4 22.4l2.1 2.1M24.5 7.5l-2.1 2.1M9.6 22.4l-2.1 2.1"/></symbol>
  <symbol id="i-frost" viewBox="0 0 32 32"><path class="ln" d="M16 3.5v25M5.2 9.75l21.6 12.5M5.2 22.25l21.6-12.5M12.5 5.5L16 8.5l3.5-3M12.5 26.5l3.5-3 3.5 3"/></symbol>
  <symbol id="i-heat" viewBox="0 0 32 32"><path class="ln" d="M13 19.2V7a3 3 0 0 1 6 0v12.2a5 5 0 1 1-6 0zM16 12v10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 32 32"><path class="ln" d="M26 16a10 10 0 1 1-3-7.1M26 5v5h-5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 32 32"><path class="ln" d="M16 29s9-8.2 9-15a9 9 0 1 0-18 0c0 6.8 9 15 9 15z"/><circle class="ln" cx="16" cy="14" r="3"/></symbol>
  <symbol id="i-search" viewBox="0 0 32 32"><circle class="ln" cx="14" cy="14" r="8"/><path class="ln" d="M20 20l7 7"/></symbol>
  <symbol id="i-locate" viewBox="0 0 32 32"><circle class="ln" cx="16" cy="16" r="6"/><path class="ln" d="M16 3v5M16 24v5M3 16h5M24 16h5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 32 32"><path class="ln" d="M9 13l7 7 7-7"/></symbol>
  <symbol id="i-close" viewBox="0 0 32 32"><path class="ln" d="M8 8l16 16M24 8L8 24"/></symbol>
  <symbol id="i-check" viewBox="0 0 32 32"><path class="ln" d="M7 17l6 6 12-13"/></symbol>
  <symbol id="i-sunrise" viewBox="0 0 32 32"><path class="ln" d="M5 25h22M9 25a7 7 0 0 1 14 0M16 8v4M6.5 14.5l2.2 2.2M25.5 14.5l-2.2 2.2M12 6l4-3 4 3"/></symbol>
  <symbol id="i-sunset" viewBox="0 0 32 32"><path class="ln" d="M5 25h22M9 25a7 7 0 0 1 14 0M16 3v5M6.5 14.5l2.2 2.2M25.5 14.5l-2.2 2.2M12 5l4 3 4-3"/></symbol>
</svg>

<div class="pull" id="pull" aria-hidden="true">Frissítés</div>

<div class="app">
  <header class="top">
    <button class="place" id="placeBtn" aria-haspopup="dialog">
      <svg class="ic"><use href="#i-pin"/></svg>
      <span id="placeName">Debrecen</span>
      <svg class="ic sm"><use href="#i-chevron"/></svg>
    </button>
    <span class="stamp" id="stamp"></span>
    <button class="round" id="refreshBtn" aria-label="Frissítés"><svg class="ic"><use href="#i-refresh"/></svg></button>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main id="main" aria-live="polite">
    <section class="hero" id="hero"><p class="loading">Adatok betöltése…</p></section>
    <section class="parts" id="parts"></section>
    <section class="hourly" id="hourly"></section>
    <section class="planner" id="planner"></section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<dialog class="sheet" id="sheet" aria-label="Hely választása">
  <div class="sheet-in">
    <div class="sheet-bar">
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Város keresése" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      </label>
      <button class="round" id="sheetClose" aria-label="Bezárás"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <button class="locate" id="locateBtn"><svg class="ic"><use href="#i-locate"/></svg><span>Jelenlegi helyem</span></button>
    <ul class="results" id="results"></ul>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
