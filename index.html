<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontos Időjárás PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
</head>
<body>
    <!-- Pull-to-refresh indicator -->
    <div id="pullRefreshIndicator" class="pull-indicator">Frissítés...</div>

    <div class="app-container">
        <!-- Top bar: Location switcher & Refresh button -->
        <header class="app-header">
            <div class="location-box">
                <input type="text" id="cityInput" placeholder="Város (pl. Debrecen)..." value="Debrecen">
                <button id="searchBtn">Váltás</button>
                <button id="refreshBtn" title="Frissítés" style="background: #334155; color: #38bdf8; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">🔄</button>
            </div>
        </header>

        <!-- Main Current Weather -->
        <main id="weatherMain" class="weather-main">
            <div class="loading">Adatok betöltése...</div>
        </main>

        <!-- 36-hour Hourly Section -->
        <section class="section-box">
            <h2>Következő 36 óra</h2>
            <div class="horizontal-scroll" id="hourlyScroll"></div>
        </section>

        <!-- Extended Daily Section -->
        <section class="section-box">
            <h2>16 napos előrejelzés</h2>
            <div class="horizontal-scroll" id="dailyScroll"></div>
        </section>

        <!-- Heatmap Section with Toggle -->
        <section class="section-box">
            <div class="heatmap-header-row">
                <h2>Időjárás Hőtérkép</h2>
                <button id="heatmapToggleBtn" class="toggle-btn">Csapadékra vált</button>
            </div>
            <div class="heatmap-wrapper" id="heatmapWrapper">
                <!-- JS fills this -->
            </div>
            <div class="heatmap-legend" id="heatmapLegend">
                <span>Kevesebb</span>
                <div class="legend-colors">
                    <span class="l-box" style="background: #1e293b;"></span>
                    <span class="l-box" style="background: #0e4429;"></span>
                    <span class="l-box" style="background: #006d32;"></span>
                    <span class="l-box" style="background: #26a641;"></span>
                    <span class="l-box" style="background: #39d353;"></span>
                </div>
                <span>Több</span>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
